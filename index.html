    <!-- Apply the saved theme before first paint (ids must match src/theme/themes.js). -->
    <script>
      (function () {
        var ids = ['porcelain', 'studio-sage', 'midnight-sui'];
        var el = document.documentElement;
        try {
          var saved = localStorage.getItem('tyr-theme');
          if (ids.indexOf(saved) !== -1) el.dataset.theme = saved;
          if (localStorage.getItem('tyr-motion') === 'paused') el.dataset.motion = 'paused';
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
